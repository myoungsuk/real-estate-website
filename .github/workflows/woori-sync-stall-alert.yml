# 우리집부동산 매물 자동 받기(사무소 PC 작업 스케줄러, 매일 09:20 한국 시각, scripts/run-woori-sync-local.mjs)가 멈췄는지 매일 13:00 한국 시각에 본다(2026-11-25).
# PC가 꺼져 있거나 작업이 아예 돌지 않으면 PC 쪽 실패 이슈가 열리지 않으므로, master의 .github/listing-review-state.json에서
# 우리집부동산 매물 lastSeenAt 최댓값이 한국 날짜 오늘이 아니면 '우리집부동산 매물 자동 받기 실패' 이슈를 연다(열려 있으면 댓글).
# 우리집부동산을 부르지 않는다. 이슈를 닫는 것은 PC 받기의 다음 성공이다(봇이 연 이슈도 닫음).
name: Woori sync stall alert

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: woori-sync-stall-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      status: ${{ steps.stale.outputs.status }}
      last_seen: ${{ steps.stale.outputs.last_seen }}
    steps:
      - name: Require master branch
        run: test "$GITHUB_REF" = "refs/heads/master"

      # 판정 스크립트와 상태 파일 두 개만 받는다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github/listing-review-state.json
            scripts/check-woori-sync-stale.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Check last Woori sync date
        id: stale
        run: node scripts/check-woori-sync-stale.mjs --state .github/listing-review-state.json

  alert:
    needs: [check]
    if: ${{ needs.check.outputs.status == 'stale' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or comment stall issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          LAST_SEEN: ${{ needs.check.outputs.last_seen }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="우리집부동산 매물 자동 받기 실패"
          # 봇이나 저장소 주인(사무소 PC의 gh 계정)이 연 같은 제목의 열린 이슈만 쓴다.
          # PC 받기가 실패해 연 이슈에는 새로 열지 않고 댓글을 달아, PC의 다음 성공이 이슈 하나만 닫으면 되게 한다.
          list_issue() {
            gh issue list --state open --limit 200 --json number,title,author \
              --jq "map(select(.title == \"$title\" and (.author.is_bot or .author.login == \"$OWNER\"))) | .[0].number // empty"
          }
          if ! number="$(list_issue)"; then
            sleep 10
            if ! number="$(list_issue)"; then
              echo "::warning::알림 이슈 목록을 읽지 못해 새 이슈를 엽니다."
              number=""
            fi
          fi
          body_file="$RUNNER_TEMP/woori-stall.md"
          printf '%s\n' \
            "사무소 PC가 매일 09:20(한국 시간) 우리집부동산 공개 매물을 받아 홈페이지 목록에 반영하는 작업이 오늘 13:00까지 홈페이지 저장소에 올라오지 않았습니다. PC가 꺼져 있었거나 작업 스케줄러가 돌지 않았을 수 있습니다." \
            "" \
            "- 실행: $RUN_URL" \
            "- 마지막으로 받은 날: ${LAST_SEEN:-확인 못 함}" \
            "" \
            "우리집부동산은 짧은 시간에 여러 번 부르면 IP를 막으므로 손으로 다시 돌릴 때는 한 번만 돌립니다. 사무소 PC의 다음 받기가 성공하면 이 이슈가 저절로 닫힙니다." \
            > "$body_file"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$body_file"
          else
            gh issue create --title "$title" --body-file "$body_file"
          fi
