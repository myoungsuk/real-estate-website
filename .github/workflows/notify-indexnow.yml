name: Notify IndexNow

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

# 커밋마다 따로 돈다. 한 묶음(group)으로 두면 GitHub가 대기 실행을 1개만 남겨, 짧은 사이에 3번 넘게 병합하면 가운데 커밋의 알림이 취소됐다.
# 실행마다 자기 커밋의 변경(HEAD^..HEAD)만 알리므로 동시에 돌아도 겹치는 주소가 두 번 나갈 뿐 빠지지 않는다.
concurrency:
  group: notify-indexnow-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  notify:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build Production sitemap and deployment marker
        env:
          PUBLIC_SITE_URL: https://leaderscityhappy.com
          PUBLIC_ALLOW_INDEXING: "true"
        run: npm run build:site
      - name: Plan changed public URLs
        id: plan
        shell: bash
        run: |
          git diff --name-only --diff-filter=ACDMRT HEAD^ HEAD > "${RUNNER_TEMP}/indexnow-changed-files.txt"
          node scripts/indexnow.mjs plan \
            --changed-files "${RUNNER_TEMP}/indexnow-changed-files.txt" \
            --sitemap dist/sitemap-0.xml \
            --output "${RUNNER_TEMP}/indexnow-urls.txt"
          url_count="$(awk 'NF { count += 1 } END { print count + 0 }' "${RUNNER_TEMP}/indexnow-urls.txt")"
          echo "url_count=${url_count}" >> "${GITHUB_OUTPUT}"
      # 뒤 커밋(매일 매물 동기화 등)이 먼저 배포돼 search 값이 달라져도, 운영이 이 커밋을 포함하면 알린다.
      - name: Wait for Production commit marker
        if: steps.plan.outputs.url_count != '0'
        env:
          INDEXED_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/verify-production-commit.mjs --commit "$INDEXED_COMMIT"
      - name: Verify published IndexNow key
        if: steps.plan.outputs.url_count != '0'
        run: node scripts/indexnow.mjs verify-key
      - name: Notify Naver IndexNow
        if: steps.plan.outputs.url_count != '0'
        run: node scripts/indexnow.mjs submit --urls-file "${RUNNER_TEMP}/indexnow-urls.txt"
