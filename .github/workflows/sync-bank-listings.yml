name: Sync Bank listings

on:
  schedule:
    - cron: "10 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: external-content-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Sync Bank public listings
        run: npm run sync:bank

      - run: npm test
      - run: npm run check
      - run: npm run build

      - name: Validate changed paths
        id: changes
        run: node scripts/check-bank-sync-worktree.mjs

      - name: Commit changed listings
        if: steps.changes.outputs.mode == 'content'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/bank-listing-sync-state.json src/data/naver-listings.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(content): sync Bank listings"
          git push origin HEAD:master
