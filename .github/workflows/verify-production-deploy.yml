name: Verify Production deploy

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Wait for Production commit marker
        env:
          PUSHED_COMMIT: ${{ github.sha }}
        run: node scripts/verify-production-commit.mjs --commit "$PUSHED_COMMIT"
